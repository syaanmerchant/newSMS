name: ci build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies 
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          sudo apt-get install -y build-essential libgtk-3-dev pkg-config

      - name: Build with Make
        run: |
          make

      - name: Run tests (placeholder)
        run: |
          # For now, just run the binary once so we know it launches
          ./medmate --help || echo "medmate exited with non-zero status"

      - name: Generate coverage (gcov)
        run: |
          # Uses the coverage target from the Makefile
          make coverage

      - name: Show generated coverage files
        run: |
          ls -R
          echo "Look for *.gcov, *.gcno, *.gcda in src/"
